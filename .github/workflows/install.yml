name: install
# Manual: runs `specage install` for a project repo from CI (no local machine needed).
# Needs secret INSTALL_TOKEN: fine-grained/classic PAT with admin on the project repo,
# and Contents + Secrets write on the data repo.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Project repo (owner/name)
        required: true
        default: TheDeepestSpace/calculator
      data_repo:
        description: Data repo
        required: true
        default: TheDeepestSpace/specage-data
      dry_run:
        description: Dry run only
        type: boolean
        default: true
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx tsc -b packages/core packages/cli
      - name: Install
        env:
          GH_TOKEN: ${{ secrets.INSTALL_TOKEN }}
          INTERN_DISPATCH_TOKEN: ${{ secrets.INTERN_DISPATCH_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.INSTALL_TOKEN }}
        run: |
          set -e
          ARGS="--repo ${{ inputs.repo }} --data-repo ${{ inputs.data_repo }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          node packages/cli/dist/bin.js install $ARGS
