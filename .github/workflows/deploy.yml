name: Deploy to Fly
on:
  push:
    branches: [main]
    paths: ['packages/core/**', 'packages/web/**', 'packages/server/**', 'deploy/**', 'Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only --config deploy/fly.toml --app "${{ vars.FLY_APP || 'specage' }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLYIO_SPECAGE_ORG_TOKEN }}
