name: Deploy to Fly (manual; automatic deploy is the deploy job in ci.yml)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only --config deploy/fly.toml --app "${{ vars.FLY_APP || 'specage' }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLYIO_SPECAGE_ORG_TOKEN }}
