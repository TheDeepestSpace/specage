name: Build Docker Images
# the-intern runs agent sessions in ghcr.io/<owner>/<repo>-dev:latest when it exists.

on:
  push:
    branches: [main]
    paths: ['.devcontainer/**', 'Dockerfile', '.github/workflows/docker-build.yml', '.github/workflows/docker-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      dev_image_name: ${{ steps.names.outputs.dev_image_name }}
    steps:
      - name: Set lower case image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "dev_image_name=ghcr.io/${REPO_LOWER}-dev" >> "$GITHUB_OUTPUT"

  build_dev_image:
    needs: prep
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.dev_image_name }}
      dockerfile: ./Dockerfile
      target: dev
    secrets: inherit
