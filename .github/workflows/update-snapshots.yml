name: Update visual snapshots
on:
  workflow_dispatch:
  # Bootstrap: generate baselines on this PR branch (remove once snapshots are committed).
  # The commit only touches __screenshots__, which is ignored here, so it can't loop.
  push:
    branches: [fix/editor-layout-playwright]
    paths-ignore: ['packages/web/visual/__screenshots__/**']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright test -c packages/web/visual/playwright.config.ts --update-snapshots
        env: {HOME: /root}
      - name: Commit snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/visual/__screenshots__
          git diff --cached --quiet || { git commit -m "test: update visual snapshots"; git push; }
