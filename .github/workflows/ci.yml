name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # core unit + Lezer-free grammar fixtures + golden files, server unit tests, CLI e2e (built binary, exit codes)
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c packages/web/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: {name: playwright-traces, path: packages/web/test-results}
      - name: Render the dogfood page (tbgwaf fixture + sample state)
        run: node packages/cli/dist/bin.js render --spec fixtures/tbgwaf/tbgwaf.specage --state fixtures/tbgwaf/state --out dogfood --repo ${{ github.repository }} --project tbgwaf
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with: {path: dogfood}
  dogfood:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true # needs Pages enabled with "GitHub Actions" as the source (HUMAN step)
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
