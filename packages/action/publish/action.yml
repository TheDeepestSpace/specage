name: specage publish
description: Render the spec and state and publish them under gh-pages/<path>/ without disturbing the rest of the site
inputs:
  spec-file: {description: spec file name on the spec branch, required: true}
  path: {description: subdirectory of gh-pages, default: specage}
  project: {description: project name, required: true}
  edit-url: {description: specage server URL, default: ''}
  cli: {description: npx spec for the specage CLI, default: 'github:TheDeepestSpace/specage#v0'}
  token: {description: token with contents write, required: true}
  branch: {description: Pages branch, default: gh-pages}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: {node-version: 22}
    - name: Fetch spec and state
      shell: bash
      env: {GH_TOKEN: ${{ inputs.token }}}
      run: |
        set -euo pipefail
        url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git clone --quiet --depth 1 --branch spec "$url" "$RUNNER_TEMP/spec"
        if git ls-remote --exit-code --heads "$url" spec-state >/dev/null; then
          git clone --quiet --depth 1 --branch spec-state "$url" "$RUNNER_TEMP/state"
        else
          mkdir -p "$RUNNER_TEMP/state"
        fi
    - name: Render
      shell: bash
      run: |
        set -euo pipefail
        npx --yes "${{ inputs.cli }}" render --spec "$RUNNER_TEMP/spec/${{ inputs.spec-file }}" \
          --state "$RUNNER_TEMP/state" --out "$RUNNER_TEMP/site" --project "${{ inputs.project }}" \
          --repo "$GITHUB_REPOSITORY" --edit-url "${{ inputs.edit-url }}"
    - name: Push to gh-pages/<path> (retry, never replaces the whole branch)
      shell: bash
      env: {GH_TOKEN: ${{ inputs.token }}}
      run: |
        set -euo pipefail
        url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        for i in 1 2 3 4 5; do
          rm -rf "$RUNNER_TEMP/pages"
          git clone --quiet --depth 1 --branch "${{ inputs.branch }}" "$url" "$RUNNER_TEMP/pages"
          dest="$RUNNER_TEMP/pages/${{ inputs.path }}"
          mkdir -p "$dest"
          rm -rf "${dest:?}/"*
          cp -R "$RUNNER_TEMP/site/." "$dest/"
          cd "$RUNNER_TEMP/pages"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name=specage-bot -c user.email=specage-bot@users.noreply.github.com commit -qm "specage: publish"
          if git push --quiet origin HEAD:${{ inputs.branch }}; then exit 0; fi
          sleep $((i * 3))
        done
        echo "push failed after 5 tries" >&2; exit 1
