name: specage fire-outbox
description: Trigger the-intern for every outbox entry added in the pushed range
inputs:
  before: {description: github.event.before, required: true}
  after: {description: github.sha, required: true}
  intern-repo: {required: true, description: the-intern repo}
  intern-workflow: {description: dispatcher workflow, default: dispatcher.yml}
  backend: {description: backend token, default: claude}
  intern-token: {required: true, description: INTERN_DISPATCH_TOKEN}
  cli: {description: npx spec for the specage CLI, default: 'github:TheDeepestSpace/specage#v0'}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: {node-version: 22}
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.intern-token }}
      run: |
        npx --yes "${{ inputs.cli }}" outbox fire --range "${{ inputs.before }}..${{ inputs.after }}" \
          --repo "$GITHUB_REPOSITORY" --intern "${{ inputs.intern-repo }}" \
          --workflow "${{ inputs.intern-workflow }}" --backend "${{ inputs.backend }}"
